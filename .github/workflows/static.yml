# Workflow para desplegar contenido estático a GitHub Pages
name: Deploy static content to Pages

on:
  # Se activa al hacer push en la rama práctica3
  push:
    branches: ["práctica3"]

  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos requeridos para el despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue simultáneo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Especifica la ruta de la carpeta que contiene tu HTML
          path: './archivar'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
