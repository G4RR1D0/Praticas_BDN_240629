version: '3.8'

services:
  postgres_yaneth:
    image: postgres:15-alpine
    container_name: postgres_yaneth_240629
    restart: always
    environment:
      POSTGRES_USER: user_240629
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: db_240629
    ports:
      - "40629:5432"
    volumes:
      - postgres_data_240629:/var/lib/postgresql/data

  mysql_yaneth:
    image: mysql:8.0
    container_name: mysql_yaneth_240629
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword240629!
      MYSQL_DATABASE: db_240629
      MYSQL_USER: user_240629
      MYSQL_PASSWORD: "1234"
    ports:
      - "40630:3306"
    volumes:
      - mysql_data_240629:/var/lib/mysql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_yaneth_240629
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: yaneth_240629@utxicotepec.edu.mx
      PGADMIN_DEFAULT_PASSWORD: "1234"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "40712:80"

volumes:
  postgres_data_240629:
  mysql_data_240629: